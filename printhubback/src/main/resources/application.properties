spring.application.name=printhubback

spring.jpa.hibernate.ddl-auto=update

# Store image upload directory
app.upload.store-directory=/app/uploads/stores

# Customer PDF upload directory
app.upload.order-directory=/app/uploads/orders

# Store image upload limit
# PDF order uploads have their own validation too
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB