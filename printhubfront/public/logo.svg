<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Soft sticker drop shadow -->
    <filter id="stickerShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#14161a" flood-opacity="0.45" />
    </filter>

    <!-- Lime glow -->
    <filter id="limeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Wing gradients -->
    <linearGradient id="limeWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8FF70" />
      <stop offset="60%" stop-color="#BAFF39" />
      <stop offset="100%" stop-color="#9DE51A" />
    </linearGradient>

    <linearGradient id="whiteWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E5EB" />
    </linearGradient>

    <linearGradient id="foldShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D414A" />
      <stop offset="100%" stop-color="#26282E" />
    </linearGradient>
  </defs>

  <!-- Flight trail dashes (Sticker Wind Swoosh) -->
  <g opacity="0.85">
    <path d="M14 104 C24 96, 34 84, 44 70" fill="none" stroke="#BAFF39" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" />
    <path d="M22 114 C36 104, 48 90, 56 76" fill="none" stroke="#E2E5EB" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9" />
    <circle cx="12" cy="106" r="3" fill="#BAFF39" />
  </g>

  <!-- STICKER BASE: Die-Cut Thick White Outline & Shadow -->
  <g filter="url(#stickerShadow)">
    <!-- White Sticker Outline Layer -->
    <path d="M112 18 
             L28 66 
             C24 68 25 74 30 75 
             L54 84 
             L62 108 
             C64 113 70 114 73 110 
             L83 96 
             L99 104 
             C104 106 110 103 111 98 
             L119 23 
             C120 18 116 16 112 18 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Paper Plane Inner Body -->
    <!-- Keel / Bottom Fold Underbelly (Shaded Slate Grey) -->
    <polygon points="56,84 62,108 78,94" fill="url(#foldShade)" stroke="#26282E" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Left Wing (Bright White with subtle depth) -->
    <polygon points="112,20 30,68 68,82" fill="url(#whiteWing)" stroke="#CBD0DC" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Center Fold Crease -->
    <polygon points="112,20 68,82 78,94" fill="#C5C9D4" stroke="#9EA3B0" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Right Wing (Vibrant Neon Lime #BAFF39) -->
    <polygon points="112,20 78,94 108,98" fill="url(#limeWing)" stroke="#8FD415" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Stylized Speed Glint on Nose -->
    <polygon points="112,20 96,36 104,26" fill="#FFFFFF" opacity="0.8" />

    <!-- Small Lime Print Dot on Wing -->
    <circle cx="92" cy="74" r="4.5" fill="#111215" opacity="0.85" />
    <circle cx="92" cy="74" r="2" fill="#BAFF39" />
  </g>
</svg>
